name: Daily BSE 52W High Sync
on:
  schedule:
    - cron: '15 10 * * 1-5' # 3:45 PM IST (10:15 UTC) Mon-Fri
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas yfinance tabulate
      - run: python fetch_bse_52w.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest_bse_52w_high.md
          git commit -m "Sync BSE 52W highs $(date +%F)" || exit 0
          git push
