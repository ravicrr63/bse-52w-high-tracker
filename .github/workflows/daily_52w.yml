name: Daily 52-Week High Archive

on:
  schedule:
    - cron: '0 13 * * 1-5' # 6:30 PM IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-52w-high:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas yfinance tabulate
      - run: python save_52w_high.py
      - name: Commit daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ latest_52w_high.md
          git commit -m "52W high data: $(date -u +'%Y-%m-%d')" || exit 0
          git push
